<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credit Assistant: AI-Powered Financial Health Advisor</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            900: '#14532d',
                        },
                        cibil: {
                            poor: '#ef4444',
                            fair: '#f59e0b',
                            good: '#3b82f6',
                            excellent: '#10b981'
                        }
                    }
                }
            }
        }
    </script>

    <!-- React, ReactDOM, Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Recharts -->
    <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
    <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
        /* Custom scrollbar for modern feel */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const { 
            ResponsiveContainer, LineChart, Line, XAxis, YAxis, Tooltip, 
            CartesianGrid, PieChart, Pie, Cell, Legend 
        } = Recharts;

        // Custom Icon wrapper to safely utilize Lucide icons inside React standalone
        const Icon = ({ name, size = 20, className = "" }) => {
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [name]);
            return <i data-lucide={name} style={{ width: size, height: size, display: 'inline-block' }} className={className}></i>;
        };

        // --- MOCK INITIAL DATABASE DATA ---
        const DEMO_USERS = {
            'demo@creditassistant.in': {
                id: 1,
                name: 'Rahul Sharma',
                email: 'demo@creditassistant.in',
                token: 'mock-jwt-token-xyz-123'
            }
        };

        const INITIAL_FINANCIAL_DATA = {
            credit_score: 680,
            monthly_income: 85000,
            monthly_expenses: 32000,
            total_debt: 180000,
            credit_limit: 300000,
            dti_ratio: 37.6,
            credit_utilization: 60.0,
            updated_at: '2026-10-01'
        };

        const INITIAL_SCORE_HISTORY = [
            { id: 1, recorded_at: 'May 2026', credit_score: 640, delta: 0 },
            { id: 2, recorded_at: 'Jun 2026', credit_score: 650, delta: 10 },
            { id: 3, recorded_at: 'Jul 2026', credit_score: 665, delta: 15 },
            { id: 4, recorded_at: 'Aug 2026', credit_score: 660, delta: -5 },
            { id: 5, recorded_at: 'Sep 2026', credit_score: 672, delta: 12 },
            { id: 6, recorded_at: 'Oct 2026', credit_score: 680, delta: 8 },
        ];

        const INITIAL_AI_ADVICE = {
            analysis: "Fair CIBIL score (680). Your credit score is in a recovery phase. Main bottlenecks are high credit card utilization (60% vs recommended <30%) and elevated DTI ratio (37.6%). Multiple active consumer durable loans and active BNPL (Buy Now Pay Later) queries have created temporary pressure on your CIBIL profile.",
            category: "Fair",
            action_plan: [
                {
                    step: 1,
                    title: "Pay Down Credit Card Balances below 30%",
                    detail: "Target reducing outstanding card balance from ₹1.8L to below ₹90,000 before the statement generation date to reflect low balance to CIBIL.",
                    impact: "High (+20 to +30 pts)"
                },
                {
                    step: 2,
                    title: "Avoid New Unsecured Loan & BNPL Enquiries",
                    detail: "Stop hard inquiries on platforms like LazyPay/Simpl or personal loan applications for 90 days to eliminate hard check penalties.",
                    impact: "Medium (+10 pts)"
                },
                {
                    step: 3,
                    title: "Consolidate High-Interest Credit Card EMIs",
                    detail: "Convert existing multi-card revolving debt into a single low-interest balance transfer or secured gold/FD loan to lower monthly DTI.",
                    impact: "High (+15 pts)"
                },
                {
                    step: 4,
                    title: "Set Up Auto-Debits for NACH/Standing Instructions",
                    detail: "Prevent accidental 1-day late fees on utility/credit card bills using ECS auto-pay tied directly to your primary salary bank account.",
                    impact: "Crucial (Protects History)"
                },
                {
                    step: 5,
                    title: "Maintain Oldest Credit Card Account Active",
                    detail: "Keep your oldest credit card active with a small recurring utility bill payment to preserve your long average credit history age.",
                    impact: "Medium (+8 pts)"
                }
            ],
            created_at: "2026-10-05"
        };

        // --- MAIN APP COMPONENT ---
        function App() {
            const [user, setUser] = useState(() => {
                const saved = localStorage.getItem('ca_user');
                return saved ? JSON.parse(saved) : DEMO_USERS['demo@creditassistant.in'];
            });
            
            const [activeTab, setActiveTab] = useState('dashboard'); // 'dashboard', 'form', 'ai', 'backend_code'
            const [financialData, setFinancialData] = useState(INITIAL_FINANCIAL_DATA);
            const [scoreHistory, setScoreHistory] = useState(INITIAL_SCORE_HISTORY);
            const [aiAdvice, setAiAdvice] = useState(INITIAL_AI_ADVICE);
            const [isAiLoading, setIsAiLoading] = useState(false);
            const [toastMessage, setToastMessage] = useState(null);

            // Auth states
            const [authMode, setAuthMode] = useState('login'); // 'login' or 'register'
            const [emailInput, setEmailInput] = useState('');
            const [passwordInput, setPasswordInput] = useState('');
            const [nameInput, setNameInput] = useState('');

            // Code viewer state
            const [selectedCodeFile, setSelectedCodeFile] = useState('main.py');

            useEffect(() => {
                if (user) {
                    localStorage.setItem('ca_user', JSON.stringify(user));
                } else {
                    localStorage.removeItem('ca_user');
                }
            }, [user]);

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(null), 4000);
            };

            // Helper for CIBIL color badges
            const getCibilCategory = (score) => {
                if (score >= 780) return { name: 'Excellent', color: 'bg-emerald-100 text-emerald-800 border-emerald-300', hex: '#10b981' };
                if (score >= 720) return { name: 'Good', color: 'bg-blue-100 text-blue-800 border-blue-300', hex: '#3b82f6' };
                if (score >= 650) return { name: 'Fair', color: 'bg-amber-100 text-amber-800 border-amber-300', hex: '#f59e0b' };
                return { name: 'Poor', color: 'bg-rose-100 text-rose-800 border-rose-300', hex: '#ef4444' };
            };

            // Handler: Login/Register
            const handleAuth = (e) => {
                e.preventDefault();
                if (!emailInput || !passwordInput) {
                    showToast("Please fill all required fields");
                    return;
                }
                if (authMode === 'register') {
                    const newUser = {
                        id: Date.now(),
                        name: nameInput || 'Valued User',
                        email: emailInput,
                        token: 'mock-jwt-' + Math.random().toString(36).substr(2, 9)
                    };
                    setUser(newUser);
                    showToast(`Welcome, ${newUser.name}! Account created successfully.`);
                } else {
                    const existingUser = DEMO_USERS[emailInput] || {
                        id: Date.now(),
                        name: emailInput.split('@')[0],
                        email: emailInput,
                        token: 'mock-jwt-auth-session'
                    };
                    setUser(existingUser);
                    showToast(`Logged in successfully as ${existingUser.name}`);
                }
            };

            const handleLogout = () => {
                setUser(null);
                showToast("Logged out successfully");
            };

            const handleSaveFinancialData = (formData) => {
                const score = parseInt(formData.credit_score);
                const income = parseFloat(formData.monthly_income);
                const expenses = parseFloat(formData.monthly_expenses);
                const debt = parseFloat(formData.total_debt);
                const limit = parseFloat(formData.credit_limit);

                // Derived calculations (backend standard)
                const util = limit > 0 ? parseFloat(((debt / limit) * 100).toFixed(1)) : 0;
                const dti = income > 0 ? parseFloat(((expenses / income) * 100).toFixed(1)) : 0;

                const prevScore = financialData.credit_score;
                const delta = score - prevScore;

                const updatedFinancials = {
                    credit_score: score,
                    monthly_income: income,
                    monthly_expenses: expenses,
                    total_debt: debt,
                    credit_limit: limit,
                    dti_ratio: dti,
                    credit_utilization: util,
                    updated_at: new Date().toISOString().split('T')[0]
                };

                setFinancialData(updatedFinancials);

                // Add to history
                const dateLabel = new Date().toLocaleDateString('en-US', { month: 'short', year: 'numeric' });
                const newHistory = [
                    ...scoreHistory,
                    {
                        id: Date.now(),
                        recorded_at: dateLabel,
                        credit_score: score,
                        delta: delta
                    }
                ];
                setScoreHistory(newHistory);

                showToast(`Financial metrics updated! Score Delta: ${delta >= 0 ? '+' : ''}${delta}`);
                setActiveTab('dashboard');
            };

            const generateAiAdvice = () => {
                setIsAiLoading(true);
                setTimeout(() => {
                    const score = financialData.credit_score;
                    const category = getCibilCategory(score).name;
                    const util = financialData.credit_utilization;
                    const dti = financialData.dti_ratio;

                    let newPlan = [];
                    let analysis = "";

                    if (score >= 750) {
                        analysis = `Excellent financial status (CIBIL ${score}). Your overall credit discipline is remarkable with credit utilization at ${util}% and DTI ratio at ${dti}%. You qualify for prime lending rates across major Indian banks (HDFC, SBI, ICICI).`;
                        newPlan = [
                            { step: 1, title: "Negotiate Interest Rate Reductions", detail: "Request your primary card issuers and loan providers to reduce interest rates or convert to prime account status.", impact: "High Savings" },
                            { step: 2, title: "Leverage Pre-Approved Lifetime Free Cards", detail: "Apply for premium rewards cards with zero joining fees to further reduce overall utilization ratio.", impact: "Perks & Multiplier" },
                            { step: 3, title: "Optimize Home/Car Loan EMI Balances", detail: "Consider partial prepayments on existing high-value home loans to drastically reduce long-term interest burden.", impact: "Wealth Boost" },
                            { step: 4, title: "Maintain Diverse Credit Mix", detail: "Keep a balanced combination of secured and unsecured credit without closing long-standing oldest cards.", impact: "Score Stability" },
                            { step: 5, title: "Monitor Annual CIBIL & Experian Reports", detail: "Schedule half-yearly audit of official RBI-approved credit bureau records to prevent identity theft or errors.", impact: "Risk Guard" }
                        ];
                    } else if (score >= 680) {
                        analysis = `Fair to Good status (CIBIL ${score}). DTI is recorded at ${dti}% and Utilization is at ${util}%. Addressing your credit utilization bottleneck will quickly boost you into the 750+ Excellent zone.`;
                        newPlan = [
                            { step: 1, title: "Maintain Credit Card Utilization under 30%", detail: `Reduce monthly card spending or pay balances before statement date. Current utilization is ${util}%.`, impact: "High (+25 pts)" },
                            { step: 2, title: "Request Credit Limit Enhancement", detail: "Ask existing bank card providers for a limit enhancement without hard pull to instantly lower utilization percentage.", impact: "Quick Fix (+15 pts)" },
                            { step: 3, title: "Prioritize High-Interest Card Debt", detail: "Pay off credit card balances exceeding 18% APR before servicing low-interest educational or personal loans.", impact: "High (+20 pts)" },
                            { step: 4, title: "Limit Unsecured Loan Inquiries", detail: "Avoid submitting multiple credit card/personal loan applications through aggregation portals within short intervals.", impact: "Medium (+10 pts)" },
                            { step: 5, title: "Automate EMI Payments via ECS/NACH", detail: "Avoid missing EMI payment deadlines due to manual processing delays by linking salary account autopay.", impact: "Crucial Protection" }
                        ];
                    } else {
                        analysis = `Attention Required (CIBIL ${score}). High utilization (${util}%) and DTI (${dti}%) indicate credit strain. Swift action on repayment and avoiding fresh credit line applications will initiate score recovery.`;
                        newPlan = [
                            { step: 1, title: "Opt for a Secured Credit Card (FD-backed)", detail: "Open a Fixed Deposit with banks like Kotak or SBI and issue an FD-backed secured credit card. Pay on time for 6 months.", impact: "High (+40 pts)" },
                            { step: 2, title: "Clear Defaulted or Overdue Balances", detail: "Settle any overdue accounts or late payments appearing on CIBIL to clear adverse remarks from bureau logs.", impact: "Critical" },
                            { step: 3, title: "Stop Fresh Credit Applications Immediately", detail: "Refrain from applying for BNPL products, credit cards, or instant loan apps for at least 6 months.", impact: "Medium (+15 pts)" },
                            { step: 4, title: "Restructure EMI Repayment Schedule", detail: "Approach lenders to convert heavy credit card outstanding amounts into fixed 12-36 month EMIs with lower APR.", impact: "High Relief" },
                            { step: 5, title: "Track Monthly Expenses via UPI Budgeting", detail: "Set daily UPI transaction limits and channel excess savings toward debt reduction.", impact: "Foundational" }
                        ];
                    }

                    setAiAdvice({
                        analysis,
                        category,
                        action_plan: newPlan,
                        created_at: new Date().toISOString().split('T')[0]
                    });

                    setIsAiLoading(false);
                    showToast("New AI Credit Advice generated by Google Gemini!");
                    setActiveTab('ai');
                }, 1200);
            };

            // Seed preset scenarios
            const loadSeedScenario = (type) => {
                if (type === 'fair_high_util') {
                    setFinancialData({
                        credit_score: 660,
                        monthly_income: 75000,
                        monthly_expenses: 35000,
                        total_debt: 210000,
                        credit_limit: 250000,
                        dti_ratio: 46.7,
                        credit_utilization: 84.0,
                        updated_at: '2026-10-08'
                    });
                    showToast("Loaded Scenario: Fair Score with High Debt & High Utilization");
                } else if (type === 'excellent_optimized') {
                    setFinancialData({
                        credit_score: 790,
                        monthly_income: 140000,
                        monthly_expenses: 30000,
                        total_debt: 60000,
                        credit_limit: 500000,
                        dti_ratio: 21.4,
                        credit_utilization: 12.0,
                        updated_at: '2026-10-08'
                    });
                    showToast("Loaded Scenario: Prime Applicant (790 CIBIL, Low Debt)");
                }
            };

            if (!user) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4 bg-slate-100">
                        <div className="max-w-md w-full bg-white rounded-2xl shadow-xl border border-slate-200 p-8">
                            <div className="text-center mb-6">
                                <div className="inline-flex items-center justify-center w-14 h-14 bg-emerald-100 text-emerald-600 rounded-2xl mb-3">
                                    <Icon name="shield-check" size={32} />
                                </div>
                                <h1 className="text-2xl font-bold text-slate-900">Credit Assistant</h1>
                                <p className="text-sm text-slate-500 mt-1">AI-Powered Financial Health Advisor for India</p>
                            </div>

                            <div className="flex border-b border-slate-200 mb-6">
                                <button 
                                    className={`flex-1 py-2 font-medium text-sm text-center border-b-2 ${authMode === 'login' ? 'border-emerald-600 text-emerald-600' : 'border-transparent text-slate-400'}`}
                                    onClick={() => setAuthMode('login')}
                                >
                                    Login
                                </button>
                                <button 
                                    className={`flex-1 py-2 font-medium text-sm text-center border-b-2 ${authMode === 'register' ? 'border-emerald-600 text-emerald-600' : 'border-transparent text-slate-400'}`}
                                    onClick={() => setAuthMode('register')}
                                >
                                    Register
                                </button>
                            </div>

                            <form onSubmit={handleAuth} className="space-y-4">
                                {authMode === 'register' && (
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 mb-1 uppercase">Full Name</label>
                                        <input 
                                            type="text" 
                                            value={nameInput} 
                                            onChange={(e) => setNameInput(e.target.value)}
                                            placeholder="Rahul Sharma" 
                                            className="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm"
                                            required
                                        />
                                    </div>
                                )}
                                <div>
                                    <label className="block text-xs font-semibold text-slate-600 mb-1 uppercase">Email Address</label>
                                    <input 
                                        type="email" 
                                        value={emailInput} 
                                        onChange={(e) => setEmailInput(e.target.value)}
                                        placeholder="user@example.in" 
                                        className="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm"
                                        required
                                    />
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold text-slate-600 mb-1 uppercase">Password</label>
                                    <input 
                                        type="password" 
                                        value={passwordInput} 
                                        onChange={(e) => setPasswordInput(e.target.value)}
                                        placeholder="••••••••" 
                                        className="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm"
                                        required
                                    />
                                </div>
                                <button 
                                    type="submit" 
                                    className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 rounded-xl transition duration-200 shadow-lg shadow-emerald-600/20 text-sm flex items-center justify-center gap-2"
                                >
                                    <Icon name={authMode === 'login' ? 'log-in' : 'user-plus'} size={18} />
                                    {authMode === 'login' ? 'Access Dashboard' : 'Create Advisor Account'}
                                </button>
                            </form>

                            <div className="mt-6 pt-6 border-t border-slate-100 text-center">
                                <p className="text-xs text-slate-400">Quick Test Credentials:</p>
                                <button 
                                    onClick={() => { setEmailInput('demo@creditassistant.in'); setPasswordInput('demo123'); }}
                                    className="mt-1 text-xs font-medium text-emerald-600 hover:underline"
                                >
                                    Auto-fill Demo Credentials (demo@creditassistant.in)
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            const cibilBadge = getCibilCategory(financialData.credit_score);
            const latestDelta = scoreHistory.length > 0 ? scoreHistory[scoreHistory.length - 1].delta : 0;

            // Pie chart dataset construction
            const pieData = [
                { name: 'Used Credit', value: financialData.total_debt, fill: '#ef4444' },
                { name: 'Available Limit', value: Math.max(0, financialData.credit_limit - financialData.total_debt), fill: '#10b981' }
            ];

            return (
                <div className="min-h-screen flex flex-col">
                    {}
                    <header className="bg-white border-b border-slate-200 sticky top-0 z-30">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                            <div className="flex items-center space-x-3">
                                <div className="p-2 bg-emerald-500 text-white rounded-xl shadow-md">
                                    <Icon name="trending-up" size={24} />
                                </div>
                                <div>
                                    <h1 className="font-bold text-slate-900 text-lg leading-none">Credit Assistant</h1>
                                    <span className="text-xs text-slate-500 font-medium">AI Financial Health Advisor</span>
                                </div>
                            </div>

                            {/* Nav items */}
                            <div className="hidden md:flex items-center space-x-1 bg-slate-100 p-1 rounded-xl">
                                <button 
                                    onClick={() => setActiveTab('dashboard')}
                                    className={`px-4 py-2 rounded-lg text-xs font-semibold transition flex items-center gap-1.5 ${activeTab === 'dashboard' ? 'bg-white text-emerald-700 shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}
                                >
                                    <Icon name="layout-dashboard" size={16} /> Dashboard
                                </button>
                                <button 
                                    onClick={() => setActiveTab('form')}
                                    className={`px-4 py-2 rounded-lg text-xs font-semibold transition flex items-center gap-1.5 ${activeTab === 'form' ? 'bg-white text-emerald-700 shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}
                                >
                                    <Icon name="edit-3" size={16} /> Financial Data Form
                                </button>
                                <button 
                                    onClick={() => setActiveTab('ai')}
                                    className={`px-4 py-2 rounded-lg text-xs font-semibold transition flex items-center gap-1.5 ${activeTab === 'ai' ? 'bg-white text-emerald-700 shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}
                                >
                                    <Icon name="sparkles" size={16} /> Gemini AI Advisor
                                </button>
                                <button 
                                    onClick={() => setActiveTab('backend_code')}
                                    className={`px-4 py-2 rounded-lg text-xs font-semibold transition flex items-center gap-1.5 ${activeTab === 'backend_code' ? 'bg-white text-emerald-700 shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}
                                >
                                    <Icon name="code-2" size={16} /> Source Code Explorer
                                </button>
                            </div>

                            {/* User Menu */}
                            <div className="flex items-center space-x-3">
                                <div className="text-right hidden sm:block">
                                    <div className="text-xs font-bold text-slate-800">{user.name}</div>
                                    <div className="text-[10px] text-slate-400">{user.email}</div>
                                </div>
                                <button 
                                    onClick={handleLogout}
                                    className="p-2 text-slate-500 hover:text-rose-600 hover:bg-rose-50 rounded-xl transition"
                                    title="Logout"
                                >
                                    <Icon name="log-out" size={18} />
                                </button>
                            </div>
                        </div>

                        {/* Mobile Navigation Tabs */}
                        <div className="md:hidden flex border-t border-slate-100 overflow-x-auto px-2 py-1 bg-slate-50">
                            <button 
                                onClick={() => setActiveTab('dashboard')}
                                className={`flex-1 py-2 px-3 text-xs font-medium whitespace-nowrap text-center ${activeTab === 'dashboard' ? 'text-emerald-600 font-bold border-b-2 border-emerald-600' : 'text-slate-600'}`}
                            >
                                Dashboard
                            </button>
                            <button 
                                onClick={() => setActiveTab('form')}
                                className={`flex-1 py-2 px-3 text-xs font-medium whitespace-nowrap text-center ${activeTab === 'form' ? 'text-emerald-600 font-bold border-b-2 border-emerald-600' : 'text-slate-600'}`}
                            >
                                Update Data
                            </button>
                            <button 
                                onClick={() => setActiveTab('ai')}
                                className={`flex-1 py-2 px-3 text-xs font-medium whitespace-nowrap text-center ${activeTab === 'ai' ? 'text-emerald-600 font-bold border-b-2 border-emerald-600' : 'text-slate-600'}`}
                            >
                                AI Advice
                            </button>
                            <button 
                                onClick={() => setActiveTab('backend_code')}
                                className={`flex-1 py-2 px-3 text-xs font-medium whitespace-nowrap text-center ${activeTab === 'backend_code' ? 'text-emerald-600 font-bold border-b-2 border-emerald-600' : 'text-slate-600'}`}
                            >
                                Architecture & Code
                            </button>
                        </div>
                    </header>

                    {/* Toast Notification Floating Banner */}
                    {toastMessage && (
                        <div className="fixed bottom-5 right-5 z-50 bg-slate-900 text-white px-5 py-3 rounded-xl shadow-2xl flex items-center space-x-3 text-xs animate-bounce border border-slate-700">
                            <Icon name="info" size={18} className="text-emerald-400" />
                            <span>{toastMessage}</span>
                        </div>
                    )}

                    {/* MAIN CONTENT AREA */}
                    <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">

                        {}
                        {activeTab === 'dashboard' && (

from fastapi import FastAPI, Depends, HTTPException, status
from fastapi.middleware.cors import CORSMiddleware
from sqlalchemy.orm import Session
import models, schemas, auth, database, gemini_service

models.Base.metadata.create_all(bind=database.engine)

app = FastAPI(title="Credit Assistant AI API", version="1.0.0")

app.add_middleware(
    CORSMiddleware,
    allow_origins=["*"],
    allow_credentials=True,
    allow_methods=["*"],
    allow_headers=["*"],
)

@app.post("/register", response_model=schemas.UserOut)
def register_user(user: schemas.UserCreate, db: Session = Depends(database.get_db)):
    db_user = db.query(models.User).filter(models.User.email == user.email).first()
    if db_user:
        raise HTTPException(status_code=400, detail="Email already registered")
    hashed_pwd = auth.get_password_hash(user.password)
    new_user = models.User(name=user.name, email=user.email, hashed_password=hashed_pwd)
    db.add(new_user)
    db.commit()
    db.refresh(new_user)
    return new_user

@app.post("/login", response_model=schemas.Token)
def login_user(user_credentials: schemas.UserLogin, db: Session = Depends(database.get_db)):
    user = db.query(models.User).filter(models.User.email == user_credentials.email).first()
    if not user or not auth.verify_password(user_credentials.password, user.hashed_password):
        raise HTTPException(status_code=401, detail="Invalid Credentials")
    access_token = auth.create_access_token(data={"sub": str(user.id)})
    return {"access_token": access_token, "token_type": "bearer"}

@app.post("/financial-data", response_model=schemas.FinancialDataOut)
def update_financial_data(
    data: schemas.FinancialDataCreate, 
    current_user: models.User = Depends(auth.get_current_user),
    db: Session = Depends(database.get_db)
):
    # DTI = (monthly_expenses / monthly_income) * 100
    dti = (data.monthly_expenses / data.monthly_income) * 100 if data.monthly_income > 0 else 0
    # Utilization = (total_debt / credit_limit) * 100
    utilization = (data.total_debt / data.credit_limit) * 100 if data.credit_limit > 0 else 0

    fin_entry = db.query(models.FinancialData).filter(models.FinancialData.user_id == current_user.id).first()
    prev_score = fin_entry.credit_score if fin_entry else data.credit_score
    delta = data.credit_score - prev_score

    if not fin_entry:
        fin_entry = models.FinancialData(user_id=current_user.id)

    fin_entry.credit_score = data.credit_score
    fin_entry.monthly_income = data.monthly_income
    fin_entry.monthly_expenses = data.monthly_expenses
    fin_entry.total_debt = data.total_debt
    fin_entry.credit_limit = data.credit_limit
    fin_entry.dti_ratio = round(dti, 2)
    fin_entry.credit_utilization = round(utilization, 2)

    # Save to Score History
    history = models.ScoreHistory(
        user_id=current_user.id,
        credit_score=data.credit_score,
        improvement_delta=delta
    )
    db.add(fin_entry)
    db.add(history)
    db.commit()
    db.refresh(fin_entry)
    return fin_entry

@app.post("/ai-advice")
def get_ai_advice(
    current_user: models.User = Depends(auth.get_current_user),
    db: Session = Depends(database.get_db)
):
    fin_data = db.query(models.FinancialData).filter(models.FinancialData.user_id == current_user.id).first()
    if not fin_data:
        raise HTTPException(status_code=404, detail="Financial data not found")
    advice = gemini_service.generate_credit_advice(fin_data)
    return advice`}

import os
from sqlalchemy import create_engine
from sqlalchemy.ext.declarative import declarative_base
from sqlalchemy.orm import sessionmaker

SQLALCHEMY_DATABASE_URL = os.getenv("DATABASE_URL", "sqlite:///./credit_assistant.db")

engine = create_engine(
    SQLALCHEMY_DATABASE_URL, connect_args={"check_same_thread": False} if "sqlite" in SQLALCHEMY_DATABASE_URL else {}
)
SessionLocal = sessionmaker(autocommit=False, autoflush=False, bind=engine)
Base = declarative_base()

def get_db():
    db = SessionLocal()
    try:
        yield db
    finally:
        db.close()`}

def calculate_dti(monthly_expenses, monthly_income):
    if monthly_income <= 0:
        return 0.0
    return round((monthly_expenses / monthly_income) * 100, 2)

def calculate_utilization(total_debt, credit_limit):
    if credit_limit <= 0:
        return 0.0
    return round((total_debt / credit_limit) * 100, 2)

def test_dti_calculation():
    assert calculate_dti(32000, 85000) == 37.65
    assert calculate_dti(0, 50000) == 0.0
